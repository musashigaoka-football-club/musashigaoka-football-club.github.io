:root {

.sidenav { display: none; }

/* ページの骨組み */
main.page { max-width: var(--page); margin: 0 auto; padding: var(--s5) var(--s4) var(--s7); display: grid; gap: var(--s6); }
.split { display: grid; grid-template-columns: minmax(0, 1.618fr) minmax(0, 1fr); gap: var(--s5); align-items: start; }

.masthead { display: grid; gap: var(--s3); }

/* 数字のタイル（そのページの要点になる数字だけ） */

/* 勝ち上がりの道（相手ページへの入口） */

.road .step-h .r { font-weight: 700; }
.road .step-h .d { margin-left: auto; font-family: var(--f-num); font-size: var(--t-1); color: var(--muted); }
a.team-card { display: grid; gap: var(--s2); padding: var(--s4); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); color: var(--ink); text-decoration: none; transition: border-color .15s, transform .15s; min-height: 44px; }

a.team-card dd.us { color: var(--us); }
a.team-card.decided { background: transparent; }
a.team-card .out-note { padding-top: var(--s2); border-top: 1px solid var(--rule); color: var(--muted); font-size: var(--t-1); font-weight: 700; }
a.team-card.out { background: var(--sunk); }
a.team-card.out .nm b, a.team-card.out .form { color: var(--muted); }
a.team-card.out .nm .go { color: var(--muted); }

/* トーナメント表（公式の表と同じく、勝ち上がりは赤線） */
svg.bracket { width: 100%; height: auto; display: block; }
svg.bracket text { font-family: var(--f-ja); fill: var(--ink); }
svg.bracket .ln { stroke: var(--rule-strong); stroke-width: 1.5; fill: none; }
svg.bracket .ln.win { stroke: var(--win); stroke-width: 3; }
svg.bracket .ln.path { stroke: var(--us); stroke-width: 2; stroke-dasharray: 4 4; }
svg.bracket .mno { font-family: var(--f-num); font-size: 11px; font-weight: 600; fill: var(--ink-2); }
svg.bracket .mlab { font-family: var(--f-num); font-size: 11px; fill: var(--muted); }
svg.bracket .score { font-family: var(--f-num); font-size: 12px; font-weight: 700; fill: var(--win); }
svg.bracket .slot { font-family: var(--f-num); font-size: 11px; fill: var(--muted); }
svg.bracket .nm { font-size: 13.5px; font-weight: 700; }
svg.bracket .pct { font-family: var(--f-num); font-size: 11px; fill: var(--muted); }
svg.bracket .hit { fill: transparent; }
svg.bracket a:hover .hit { fill: var(--sunk); }
svg.bracket a:focus-visible .hit { stroke: var(--focus); stroke-width: 2; }
svg.bracket .me .hit { fill: var(--us-soft); }
svg.bracket .me .nm { fill: var(--us); }
svg.bracket .out .nm { fill: var(--muted); font-weight: 400; }
svg.bracket .dest { font-family: var(--f-num); font-weight: 700; font-size: 14px; fill: var(--ink); }

/* 日程 */
.sched { display: grid; }
.sched .r { display: grid; grid-template-columns: 55px 89px minmax(0, 1fr); gap: var(--s2); padding-block: var(--s3); border-top: 1px solid var(--rule); align-items: baseline; font-size: 13.5px; }
.sched .r:first-child { border-top: 0; padding-top: 0; }
.sched .r .m { font-family: var(--f-num); color: var(--muted); font-weight: 600; }
.sched .r .dt { font-family: var(--f-num); font-weight: 600; }
.sched .r .done { font-family: var(--f-num); font-weight: 700; color: var(--win); }
.sched .r.mine { font-weight: 700; }
.sched .r .where { display: block; color: var(--muted); font-size: var(--t-1); font-weight: 400; }

/* グラフ */
.figure { display: grid; gap: var(--s3); }
.figure .cap { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.legend { display: flex; gap: var(--s4); font-size: var(--t-1); color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top-style: dashed; }
.legend i.box { width: 10px; height: 10px; border: 0; border-radius: 2px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { font-family: var(--f-num); font-size: 12px; fill: var(--muted); }
svg.chart .grid line { stroke: var(--rule); stroke-width: 1; }
svg.chart .base { stroke: var(--rule-strong); stroke-width: 1; }
svg.chart .val { fill: var(--ink); font-weight: 600; }
svg.chart .lab-ja { font-family: var(--f-ja); font-size: 12.5px; fill: var(--ink-2); font-weight: 700; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--ground); font-size: var(--t-1); line-height: 1.55; padding: var(--s2) var(--s3); border-radius: var(--r-sm); white-space: nowrap; box-shadow: 0 5px 21px rgba(0,0,0,.18); }
.tip b { font-family: var(--f-num); font-weight: 600; }

/* 表 */
.tbl { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: var(--s2) var(--s3); border-top: 1px solid var(--rule); vertical-align: top; line-height: 1.55; }
thead th { border-top: 0; background: var(--sunk); color: var(--muted); font-size: var(--t-1); font-weight: 500; white-space: nowrap; }
td.n, th.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.n { font-weight: 500; }
tr.hl td { background: var(--them-soft); font-weight: 700; }
tr.hl.us td { background: var(--us-soft); }
/* 結果: 勝ちは ○、負けは ×。形・文字・色の3つで区別する */
.res { font-weight: 700; white-space: nowrap; display: inline-flex; align-items: baseline; gap: 5px; color: var(--ink); }
.res .g { font-family: var(--f-ja); font-weight: 900; width: 1em; text-align: center; }
.res.w .g, .res.pkw .g { color: var(--us); }
.res.l, .res.pkl { color: var(--muted); font-weight: 500; }
.res.l .g, .res.pkl .g { color: var(--muted); }
.formstrip { display: inline-flex; gap: 3px; vertical-align: middle; }
.formstrip span { width: 22px; height: 22px; border-radius: 4px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; border: 1px solid var(--rule); color: var(--ink-2); background: var(--surface); }
.formstrip span.w { background: var(--ink); border-color: var(--ink); color: var(--ground); }
.formstrip span.d { background: var(--sunk); }
.formstrip span.l { color: var(--muted); }
.filters { display: flex; gap: var(--s1); flex-wrap: wrap; }
.filters button { font: inherit; font-size: 13px; min-height: 36px; padding-inline: var(--s3); border-radius: var(--r-sm); border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }

/* 要点・注記・出典 */
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s3); }
/* 本文に太字などが混ざっても1つの段落として流れるよう、格子ではなく通常の流し込みにする */
.points li { position: relative; padding-left: 21px; max-width: var(--measure); }
.points li::before { content: ""; position: absolute; left: 6px; top: .72em; width: 8px; height: 8px; border-radius: 2px; background: var(--them); }
.points.us li::before { background: var(--us); }
.points b { font-weight: 700; }
.facts { margin: 0; display: grid; }
.facts > div { display: grid; grid-template-columns: 89px minmax(0, 1fr); gap: var(--s3); padding-block: var(--s3); border-top: 1px solid var(--rule); }
.facts > div:first-child { border-top: 0; padding-top: 0; }
.facts dt { font-size: var(--t-1); color: var(--muted); }
.facts dd { margin: 0; font-size: 13.5px; line-height: 1.65; }
.facts .src { display: block; font-size: var(--t-1); color: var(--muted); overflow-wrap: anywhere; margin-top: 2px; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s2) var(--s4); margin: 0; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--f-num); font-weight: 500; font-size: var(--t0); }
.empty { color: var(--muted); font-size: 13.5px; }
details.more { border-top: 1px solid var(--rule); padding-top: var(--s3); }
details.more summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; list-style: none; gap: var(--s2); }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+"; font-family: var(--f-num); font-weight: 700; width: 21px; height: 21px; display: inline-grid; place-items: center; border: 1px solid var(--rule-strong); border-radius: 50%; font-size: 13px; }
details.more[open] summary::before { content: "−"; }
details.more .body { padding-block: var(--s3) var(--s4); display: grid; gap: var(--s3); }
.method { margin: 0; padding-left: 1.2em; display: grid; gap: var(--s2); color: var(--ink-2); font-size: 13.5px; max-width: 48em; }
.insight { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s2); padding: var(--s4); border-radius: var(--r); background: var(--surface); border: 1px solid var(--rule); }
.insight .h { font-weight: 700; font-size: var(--t1); line-height: 1.45; }
.insight .b { color: var(--ink-2); font-size: 13.5px; line-height: 1.7; }
.insight .fig { font-family: var(--f-num); font-weight: 600; font-size: var(--t3); line-height: 1; color: var(--us); }
.insights { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }
/* 計算の手順（順番に意味があるので番号を振る） */
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: st; display: grid; gap: var(--s3); }
ol.steps li { counter-increment: st; display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: var(--s3); row-gap: 2px; max-width: 40em; }
ol.steps li::before { content: counter(st); grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: var(--t1); background: var(--ink); color: var(--ground); }
ol.steps li b { font-weight: 700; }
ol.steps li span { color: var(--ink-2); font-size: 13.5px; line-height: 1.7; }
/* つながりの糸口 */
.conn-sum { display: grid; gap: var(--s2); }
.conn-bar { display: flex; gap: 2px; height: 13px; border-radius: 4px; overflow: hidden; background: var(--sunk); }
.conn-bar span { display: block; }
ol.chains { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s2); }
ol.chains li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: var(--s3); align-items: center; padding: var(--s2) var(--s3); border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
ol.chains .imp { font-weight: 700; font-size: var(--t1); text-align: center; color: var(--muted); }
ol.chains .imp.up { color: var(--us); }
ol.chains .imp.down { color: var(--link); }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 16px; font-size: 13px; }
.chain .node { font-weight: 700; white-space: nowrap; }
.chain .node.me { color: var(--us); }
.chain .node.opp { color: var(--link); }
.chain .edge { display: inline-grid; justify-items: center; line-height: 1.25; padding: 2px 8px 2px 6px; border-radius: var(--r-sm); background: var(--sunk); white-space: nowrap; position: relative; }
.chain .edge::after { content: "→"; position: absolute; right: -13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 11px; }
.chain .edge b { font-family: var(--f-num); font-weight: 600; font-size: 12.5px; }
.chain .edge small { font-size: 10.5px; color: var(--muted); }
.chain .edge.l b { color: var(--muted); }
.meter { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--us); border-radius: 4px; }
/* 前後のページ: ページの上に細い1行で置く（見出しとの間は詰める） */
.pager { display: flex; justify-content: space-between; gap: var(--s3); margin-bottom: calc(var(--s3) - var(--s6)); }
.pager a { display: inline-flex; align-items: center; gap: var(--s2); min-height: 44px; padding-inline: var(--s3); border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); text-decoration: none; color: var(--ink); font-size: 13.5px; min-width: 0; }
.pager a:hover { border-color: var(--them); }
.pager a .l { font-size: var(--t-1); color: var(--muted); white-space: nowrap; }
.pager a b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pager a.next { flex-direction: row-reverse; margin-left: auto; }
footer.foot { max-width: var(--page); margin: 0 auto; padding: 0 var(--s4) var(--s6); color: var(--muted); font-size: var(--t-1); }

/* ここまでの結果 */
ul.done-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
ul.done-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: var(--s3); align-items: baseline; padding: var(--s3) var(--s4); border-top: 1px solid var(--rule); }
ul.done-list li:first-child { border-top: 0; }
ul.done-list li.mine { background: var(--us-soft); }
ul.done-list li.rlab { display: block; padding: var(--s2) var(--s4); background: var(--sunk); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .1em; }
ul.done-list .t { color: var(--muted); }
ul.done-list .t.win { color: var(--ink); font-weight: 700; }
ul.done-list .sc { font-size: var(--t1); }
@media (max-width: 560px) { ul.done-list li { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); } ul.done-list li .small { grid-column: 1 / -1; } }

/* 当たる確率の内訳（入口ページの勝ち上がりの道） */
.result-banner { display: flex; align-items: baseline; gap: var(--s2); padding: var(--s2) var(--s3); border-radius: var(--r); background: var(--sunk); }
.result-banner.won { background: var(--us-soft); }
.result-banner .num { font-size: var(--t1); font-weight: 700; }
.meet { display: grid; gap: 6px; }
.meetbar { display: flex; gap: 2px; height: 13px; border-radius: 4px; overflow: hidden; }
.meetbar span { display: block; min-width: 2px; }
.meetbar .lose, .meetlist i.lose { background: repeating-linear-gradient(135deg, var(--sunk) 0 4px, var(--rule) 4px 6px); }
.meetlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 12.5px; line-height: 1.5; }
.meetlist li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 8px; align-items: start; }
.meetlist i { width: 10px; height: 10px; border-radius: 2px; margin-top: 5px; }
.meetlist b { font-weight: 700; }
.meetlist small { display: block; color: var(--muted); font-size: 11.5px; }

/* 2次予選の強豪 */
.meter.them i { background: var(--them); }
table.rank td.nm a { font-weight: 700; }
table.rank th button.sort { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; min-height: 28px; }
table.rank th button.sort::after { content: "↕"; font-size: 10px; opacity: .45; }
table.rank th button.sort[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
table.rank th button.sort[aria-pressed="true"]::after { content: "↓"; opacity: 1; }
.totcell { display: grid; grid-template-columns: 2.6em 5em; gap: 8px; align-items: center; }
details.seed { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); scroll-margin-top: 70px; }
details.seed[open] { border-color: var(--rule-strong); }
details.seed > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); min-height: 55px; }
details.seed > summary::-webkit-details-marker { display: none; }
details.seed > summary:hover { background: var(--sunk); }
details.seed .rk { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: var(--t1); background: var(--them-soft); color: var(--link); }
details.seed[open] .rk { background: var(--them); color: var(--surface); }
details.seed .nm { display: grid; line-height: 1.35; min-width: 0; }
details.seed .nm b { font-size: var(--t1); font-weight: 900; letter-spacing: .02em; }
details.seed .tot, details.seed .vs { font-weight: 600; font-size: var(--t2); line-height: 1; text-align: right; display: grid; justify-items: end; gap: 3px; }
details.seed .tot small, details.seed .vs small { font-family: var(--f-ja); font-size: 11px; font-weight: 500; color: var(--muted); }
details.seed .vs { color: var(--us); min-width: 5.5em; }
.seed-in { display: grid; gap: var(--s4); padding: var(--s3) var(--s4) var(--s4); border-top: 1px solid var(--rule); }
.seed-body { display: grid; grid-template-columns: minmax(0, 1.618fr) minmax(0, 1fr); gap: var(--s4); align-items: start; }
.seed-body .card { padding: var(--s3) var(--s4); gap: var(--s2); }
.part { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) 2em 2.6em; gap: 8px; align-items: center; font-size: 13px; }
.part .num { text-align: right; font-weight: 600; }
.part .r { font-size: 11px; text-align: right; }
nav.toc { display: flex; gap: var(--s2); flex-wrap: wrap; }
nav.toc a { display: inline-flex; align-items: center; min-height: 36px; padding-inline: var(--s3); border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); color: var(--ink-2); text-decoration: none; font-size: 13.5px; }
nav.toc a:hover { border-color: var(--them); color: var(--ink); }
section.sec[id] { scroll-margin-top: 70px; }
.tags { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; min-height: 20px; padding-inline: 7px; border-radius: 4px; font-size: 11px; font-weight: 700; background: var(--them-soft); color: var(--link); white-space: nowrap; }
.tag.warn { background: transparent; border: 1px solid var(--win); color: var(--win); }
.tag.first { background: var(--sunk); color: var(--ink-2); font-weight: 500; }
.tag.first.me { background: var(--us-soft); color: var(--us); font-weight: 700; }
.tag.club { background: transparent; color: var(--muted); font-weight: 500; border: 1px solid var(--rule); }
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.rule { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s3) var(--s4); display: grid; gap: var(--s2); align-content: start; }
.rule.open { border-style: dashed; }
.rh { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.rh b { font-weight: 700; line-height: 1.45; }
.rule .no { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--ground); font-weight: 700; flex: none; }
.rule .chip { margin-left: auto; }
.exwhy { display: grid; gap: var(--s2); padding: var(--s3) var(--s4); background: var(--them-soft); border-radius: var(--r); }
.exwhy .points li { max-width: none; font-size: 13.5px; }
.exwhy .points li.muted::before { background: var(--rule-strong); }
.tlgrid, .frgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--s3); align-items: start; }
.frgrid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.tlc, .frb { padding: var(--s3); gap: var(--s2); }
.tlc h3 { font-size: var(--t0); }
.tlc h3 small { font-weight: 500; color: var(--muted); font-size: var(--t-1); }
ol.tl { margin: 0; padding: 0; list-style: none; display: grid; }
ol.tl li { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto; gap: 6px; align-items: center; padding-block: 3px; border-top: 1px solid var(--rule); font-size: 13px; }
ol.tl li:first-child { border-top: 0; }
ol.tl li .rk { color: var(--muted); text-align: right; }
ol.tl li.seed .tm { font-weight: 700; }
ol.tl li.club .tm, ol.tl li.sub .tm { color: var(--muted); }
.frb.mine { border-color: var(--us); box-shadow: inset 0 0 0 1px var(--us); }
.frh { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.frh .small { margin-left: auto; }
.frb ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; font-size: 13px; }
.frb li { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.frb li.out { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.frb li.me { color: var(--us); font-weight: 700; }
table.tourn td { white-space: nowrap; }
table.tourn td.top { font-weight: 700; color: var(--ink); }
table.tourn .ex { display: block; font-size: 10.5px; color: var(--link); font-weight: 500; }

/* 画面幅ごとの組み替え */
@media (max-width: 1280px) { .brand span { display: none; } }
@media (max-width: 1000px) {
  nav.pages { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: thin; padding-bottom: var(--s2); }
  .split, .split.rev { grid-template-columns: minmax(0, 1fr); }
  .road { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(3) { border-left: 0; }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .nextmatch { grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
  .nextmatch .odds { text-align: left; }
  .insights { grid-template-columns: minmax(0, 1fr); }
  .seed-body { grid-template-columns: minmax(0, 1fr); }
  .rules { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  details.seed > summary { grid-template-columns: 34px minmax(0, 1fr) auto; padding-inline: var(--s3); }
  details.seed .vs { display: none; }
  .seed-in { padding-inline: var(--s3); }
}
@media (max-width: 560px) {
  h1 { font-size: var(--t3); }
  .kpi .v { font-size: var(--t3); }
  main.page { padding-inline: var(--s3); gap: var(--s5); }
  .topbar .in { padding-inline: var(--s3); }
  .brand span { display: none; }
  .pager a b { max-width: 9em; }
  .pager { margin-bottom: calc(var(--s2) - var(--s5)); }
}

/* ブロック決勝の分析（結論・解剖・勝ち筋・警戒） */
.sec.verdict, .sec.review { background: var(--surface); border: 1px solid var(--rule); border-left: 5px solid var(--us); border-radius: var(--r); padding: var(--s4) var(--s5); }
.vline { font-size: var(--t2); font-weight: 900; line-height: 1.45; letter-spacing: .01em; text-wrap: balance; }
.prose.hi { background: var(--us-soft); border-radius: var(--r); padding: var(--s3) var(--s4); font-weight: 700; max-width: none; }
a.srclink { font-size: 11px; white-space: nowrap; }
.blk { display: block; margin-top: 3px; }
.yr { font-family: var(--f-num); font-size: 11px; color: var(--muted); margin-left: 6px; }
td.q { color: var(--ink-2); font-size: 12.5px; max-width: 34em; }

.myths { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--s3); }
.myth { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s3) var(--s4); display: grid; gap: var(--s2); align-content: start; }
.myth .mh { display: grid; gap: 4px; }
.myth .mh b { color: var(--muted); font-weight: 500; text-decoration: line-through; text-decoration-thickness: 1px; line-height: 1.5; }
.myth .mr { display: grid; gap: 2px; padding-top: var(--s2); border-top: 1px solid var(--rule); }
.myth .mr b { font-size: var(--t1); line-height: 1.4; }
.num.big { font-family: var(--f-num); font-weight: 600; font-size: var(--t3); line-height: 1; color: var(--us); }

ul.clock { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
ul.clock li { display: grid; grid-template-columns: 6em minmax(0, 1fr) minmax(0, 1.2fr); gap: var(--s3); align-items: baseline; padding: var(--s3) var(--s4); background: var(--surface); }
ul.clock li b { font-size: var(--t1); color: var(--us); }

ol.plan { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s3); counter-reset: none; }
ol.plan li { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: var(--s3); background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: var(--s4); }
ol.plan .no { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--us); color: var(--us-ink); font-weight: 700; font-size: var(--t2); }
ol.plan li > div > b { font-size: var(--t1); line-height: 1.45; display: block; margin-bottom: var(--s2); }
ol.plan .ev { margin: var(--s2) 0 0; padding: var(--s2) 0 0; border-top: 1px dashed var(--rule); list-style: none; display: grid; gap: 3px; }
ol.plan .ev li { display: block; padding: 0; border: 0; background: none; font-family: var(--f-num); font-size: 12px; color: var(--muted); }
ol.plan .ev li::before { content: "根拠 "; font-family: var(--f-ja); }

.risks { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: var(--s3); }
.risk { background: var(--sunk); border-radius: var(--r); padding: var(--s3) var(--s4); display: grid; gap: var(--s2); align-content: start; border-left: 3px solid var(--win); }
.risk b { line-height: 1.45; }
@media (max-width: 560px) {
  ul.clock li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .sec.verdict, .sec.review { padding: var(--s3) var(--s4); }
  .vline { font-size: var(--t1); }
}

/* ジャイアントキリング番付 */
ol.gk { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
ol.gk li { display: grid; grid-template-columns: 2.2em 4em minmax(0, 1fr) auto; gap: var(--s3); align-items: baseline; padding: var(--s3) var(--s4); background: var(--surface); }
ol.gk li.mine { background: var(--us-soft); }
ol.gk .rk { color: var(--muted); text-align: right; }
ol.gk li.mine .rk { color: var(--us); }
ol.gk .p { font-weight: 600; font-size: var(--t1); color: var(--us); }
ol.gk .vs { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
ol.gk .vs b { font-weight: 700; }
ol.gk .vs small { color: var(--muted); font-size: 11px; }
ol.gk .vs .sc { font-family: var(--f-num); font-style: normal; font-weight: 600; background: var(--sunk); border-radius: 4px; padding: 0 6px; }
ol.gk li.gapline { display: block; text-align: center; color: var(--muted); padding: 2px; }
@media (max-width: 560px) { ol.gk li { grid-template-columns: 2.2em 4em minmax(0, 1fr); } ol.gk li > .small { grid-column: 2 / -1; } }

/* 答え合わせ・5年の軌跡 */
ul.pmlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
ul.pmlist li { display: grid; grid-template-columns: 2.4em minmax(0, 1fr); gap: var(--s3); padding: var(--s3) var(--s4); background: var(--surface); }
.vd { display: grid; place-items: center; width: 2.4em; height: 2.4em; border-radius: 50%; font-weight: 700; font-size: var(--t1); }
.vd.yes { background: var(--us-soft); color: var(--us); }
.vd.no { background: var(--sunk); color: var(--win); }
.vd.half { background: var(--sunk); color: var(--ink-2); }
.vd.na { background: var(--sunk); color: var(--muted); }
.risk.hit { border-left-color: var(--us); background: var(--us-soft); }
.card.model { border-left: 5px solid var(--them); gap: var(--s3); }
ol.years { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
ol.years li { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: var(--s3); padding: var(--s3) var(--s4); background: var(--surface); }
ol.years .yr2 { font-size: var(--t1); font-weight: 700; color: var(--muted); }
ol.years .yhead { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
ol.years .elo { font-size: var(--t2); font-weight: 600; color: var(--us); }
td.big2 { font-size: var(--t1); font-weight: 600; white-space: nowrap; }
@media (max-width: 560px) { ol.years li, ul.pmlist li { grid-template-columns: minmax(0, 1fr); } }

/* 2次予選の組み合わせ */
.blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--s4); }
.blk h3 { margin-bottom: var(--s2); font-size: var(--t1); }
ul.draw { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
ul.draw li { display: grid; grid-template-columns: minmax(0, 1fr) 3.4em minmax(0, 1fr); gap: var(--s2); align-items: baseline; padding: var(--s2) var(--s3); background: var(--surface); font-size: 13.5px; }
ul.draw li.mine { background: var(--them-soft); }
ul.draw .t { color: var(--muted); }
ul.draw .t.win { color: var(--ink); font-weight: 700; }
ul.draw b { text-align: center; color: var(--link); font-weight: 600; }

/* トーナメント表の画像 */
figure.bracket-img { margin: 0; display: grid; gap: var(--s2); }
figure.bracket-img img { width: 100%; height: auto; display: block; background: #fff; border: 1px solid var(--rule); border-radius: var(--r); }
figure.bracket-img a { display: block; }

/* 3年間の全試合 */
.tours { display: grid; gap: var(--s5); }
.tour .th { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; padding-bottom: var(--s2); border-bottom: 2px solid var(--ink); margin-bottom: var(--s3); }
.tour .th .yr { font-size: var(--t2); font-weight: 700; }
.tour .th .sr { font-size: var(--t1); font-weight: 700; }
.tour .th .rec { margin-left: auto; font-weight: 600; }
.tour .th .reach { font-size: var(--t-1); color: var(--muted); }
ul.glist { margin: 0; padding: 0; list-style: none; display: grid; }
ul.glist li { display: grid; gap: 3px; padding: var(--s3) 0; border-bottom: 1px solid var(--rule); }
ul.glist li:last-child { border-bottom: 0; }
.gl { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.gl .mark { font-size: var(--t1); width: 1.2em; text-align: center; }
ul.glist li.w .mark { color: var(--us); }
ul.glist li.l .mark { color: var(--muted); }
.gl .rnd { font-size: var(--t-1); color: var(--muted); min-width: 6em; }
.gl .sc { font-size: var(--t2); font-weight: 600; letter-spacing: .02em; }
.gl .sc small { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 5px; }
.gl .opp { font-size: var(--t1); font-weight: 700; }
.gl .dt { margin-left: auto; }
.gr { display: flex; gap: var(--s4); flex-wrap: wrap; color: var(--ink-2); padding-left: calc(1.2em + var(--s3)); }
.gr .now b { color: var(--ink); }
.shift { margin-left: 6px; font-weight: 600; }
.shift.up { color: var(--them); }
.shift.down { color: var(--muted); }
.thin-note { color: var(--muted); font-size: 11.5px; }
@media (max-width: 560px) {
  .gl .rnd { min-width: 0; }
  .gl .dt { margin-left: 0; }
  .gr { padding-left: 0; gap: var(--s2); }
}
ul.glist li.grew { background: var(--them-soft); margin-inline: calc(var(--s3) * -1); padding-inline: var(--s3); border-radius: var(--r); }
.grew-note { color: var(--link); font-weight: 600; }

/* 対戦校名鑑 */
ul.book { margin: 0; padding: 0; list-style: none; display: grid; }
ul.book li { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) 4em 10em minmax(0, 8em) minmax(0, 9em);
  gap: var(--s3); align-items: baseline; padding: var(--s2) 0; border-bottom: 1px solid var(--rule); }
ul.book li.hd { border-bottom: 2px solid var(--ink); padding-bottom: var(--s1); font-size: 11px; letter-spacing: .06em; }
ul.book li.me { background: var(--us-soft); margin-inline: calc(var(--s2) * -1); padding-inline: var(--s2); }
ul.book .rk { color: var(--muted); text-align: right; }
ul.book li.me .rk { color: var(--us); }
ul.book .nm { font-weight: 700; }
ul.book .el { font-weight: 600; }
ul.book li.me .el { color: var(--us); }
.thin-mark { color: var(--win); margin-left: 4px; }
details.dist { border-top: 0; padding-top: 0; }
details.dist > summary { min-height: 40px; border-bottom: 1px solid var(--rule); }
@media (max-width: 900px) {
  ul.book li { grid-template-columns: 2.4em minmax(0, 1fr) 4em; row-gap: 2px; }
  ul.book li > .gm, ul.book li > .bs, ul.book li > .vs { grid-column: 2 / -1; }
  ul.book li.hd > .gm, ul.book li.hd > .bs, ul.book li.hd > .vs { display: none; }
}

/* 年鑑の表紙（英字は各ページ最上部に1度だけ） */
.masthead .eyebrow { letter-spacing: .18em; }
.sub-title { margin-top: -2px; }

/* 付録（巻末のスカウティング記録） */
.sec.appendix { border-top: 2px solid var(--ink); padding-top: var(--s4); }
.sec.appendix > .sec-head h2 { font-size: var(--t1); }

/* 歩みのページ（左パネルを持たないので、上部にページ一覧を出す） */
nav.hist-nav { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); padding-bottom: var(--s3); margin-bottom: var(--s4); border-bottom: 1px solid var(--rule); font-size: 13.5px; }
nav.hist-nav a { color: var(--link); text-decoration: none; }
nav.hist-nav a:hover { text-decoration: underline; }
nav.hist-nav b { color: var(--ink); }

/* 章番号（表示順から自動で振る） */
h2 .secno { font-size: 0.62em; font-weight: 600; color: var(--muted); margin-right: .6em; letter-spacing: .06em; vertical-align: .08em; }
.sn-toc .toc-no { color: var(--muted); margin-right: .5em; font-size: 11px; }
.sn-toc li.on > a .toc-no { color: var(--us); }

/* 都内全校データベース */
.srch-box .srch { width: 100%; max-width: 30em; font: inherit; font-size: var(--t1); padding: var(--s2) var(--s3);
  border: 1px solid var(--rule-strong); border-radius: var(--r); background: var(--surface); color: var(--ink); }
.srch-box .srch:focus-visible { border-color: var(--focus); }
.srch-hint { margin-top: var(--s2); }
ul.book { margin: 0; padding: 0; list-style: none; display: grid; }
ul.book > li { border-bottom: 1px solid var(--rule); }
ul.book > li.me { background: var(--us-soft); }
details.sch > summary { list-style: none; cursor: pointer; display: grid;
  grid-template-columns: minmax(0, 1fr) 4.2em minmax(0, 11em) minmax(0, 12em); gap: var(--s3);
  align-items: baseline; padding: var(--s2) var(--s3); min-height: 40px; }
details.sch > summary::-webkit-details-marker { display: none; }
details.sch > summary:hover { background: var(--sunk); }
details.sch .nm { font-weight: 700; }
details.sch .el { font-weight: 600; font-family: var(--f-num); }
ul.book > li.me .el { color: var(--us); }
.sch-in { display: grid; gap: var(--s3); padding: var(--s3) var(--s3) var(--s4); border-top: 1px solid var(--rule); background: var(--sunk); }
.kv2 { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); font-size: 13.5px; }
.sch-blk h4 { margin: 0 0 var(--s2); font-size: var(--t-1); letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.yrs { display: flex; flex-wrap: wrap; gap: var(--s2); }
.yr-chip { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 2px var(--s3); font-size: 13px; }
ul.mini { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 13px; }
ul.mini li { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: baseline; }
ul.mini .r { width: 1.2em; text-align: center; }
ul.mini li.w .r { color: var(--us); font-weight: 700; }
ul.mini li.l .r { color: var(--muted); }
ul.mini .sc { font-family: var(--f-num); font-weight: 600; }
ul.mini .op { font-weight: 700; min-width: 7em; }
ul.mini.co li { display: grid; grid-template-columns: minmax(0, 8em) minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 760px) {
  details.sch > summary { grid-template-columns: minmax(0, 1fr) 4.2em; row-gap: 2px; }
  details.sch > summary > :nth-child(n+3) { grid-column: 1 / -1; }
  ul.mini.co li { grid-template-columns: minmax(0, 1fr); }
}
ol.rank-list { margin: 0; padding: 0; list-style: none; display: grid; }
ol.rank-list li { display: grid; grid-template-columns: 3em minmax(0, 1fr) 4.2em 6em; gap: var(--s3);
  align-items: baseline; padding: 3px var(--s3); border-bottom: 1px solid var(--rule); font-size: 13.5px; }
ol.rank-list li.me { background: var(--us-soft); font-weight: 700; }
ol.rank-list .rk { color: var(--muted); text-align: right; }
ol.rank-list .el { font-weight: 600; }

/* 大会ごとの総評・年度の増減 */
.tour-note { background: var(--sunk); border-left: 3px solid var(--rule-strong); padding: var(--s2) var(--s3); margin-bottom: var(--s3); max-width: none; font-size: 13.5px; }
td.n.up { color: var(--us); }
td.n.down { color: var(--muted); }

/* 年度ページのトーナメント表（部分木） */
.treebox { overflow-x: auto; }
svg.bracket.tree { min-width: 420px; max-width: 640px; }
svg.bracket.tree .ln.mine { stroke-width: 3.5; }
svg.bracket.tree .nm { font-size: 12.5px; font-weight: 500; }
svg.bracket.tree .nm.me-t { fill: var(--us); font-weight: 700; }
ul.glist li.u .mark { color: var(--muted); }
ul.glist .rv { margin: var(--s1) 0 0; font-size: 13.5px; max-width: none; }

/* 強さの点数の推移（全年度の通算） */
svg.eloline { width: 100%; height: auto; display: block; }
svg.eloline .grid { stroke: var(--rule); stroke-width: 1; }
svg.eloline .base { stroke: var(--rule-strong); stroke-width: 1; stroke-dasharray: 3 3; }
svg.eloline .line { fill: none; stroke: var(--us); stroke-width: 2; }
svg.eloline .dot { fill: var(--surface); stroke: var(--us); stroke-width: 2; }
svg.eloline .dot.last { fill: var(--us); }
svg.eloline .ax { font-family: var(--f-num); font-size: 11px; fill: var(--muted); }
svg.eloline .lab { font-family: var(--f-num); font-size: 12px; font-weight: 700; fill: var(--ink); }
.nw { white-space: nowrap; }

/* 2次予選 1回戦の結果 */
ul.draw li.done { grid-template-columns: minmax(0, 1fr) 3.4em minmax(0, 1fr) 6.8em 1.2em; }
ul.draw li.done .res { text-align: right; }
ul.draw li .t.lost { color: var(--muted); text-decoration: line-through; }
ul.draw li .res { font-weight: 700; white-space: nowrap; }
ul.draw li .mark.hit { color: var(--muted); }
ul.draw li .mark.miss { color: var(--win); font-weight: 700; }
tr.out td.nm { color: var(--muted); }

/* ===== Gotham 風の骨組み（2026-10-14）=====
   脇のナビと上の帯をエンジの帯にし、いま見ているページは紺の縦線で示す。小見出しは等幅の大文字 */
.eyebrow, .sn-h, .sn-grp > summary, nav.pages .grp > .lab, .tag, .brand span, .sn-brand small {
  font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .14em; font-weight: 600;
}
.eyebrow { font-size: 11px; color: var(--us); }
.eyebrow::before { content: "▍"; color: var(--us); margin-right: 4px; }
section.sec > .sec-head, section.sec > h2 { padding-top: var(--s3); border-top: 2px solid var(--us); }
h1 { letter-spacing: .01em; }
h2 { letter-spacing: .02em; }

.topbar { background: var(--chrome); border-bottom: 3px solid var(--navy); backdrop-filter: none; }
.topbar .brand, .topbar .brand b { color: var(--chrome-ink); }
.topbar .brand span { color: var(--chrome-muted); }
nav.pages .grp { background: var(--chrome-2); }
nav.pages .grp > .lab { color: var(--chrome-muted); font-size: 10px; }
nav.pages a { color: var(--chrome-ink); opacity: .86; }
nav.pages a:hover { background: var(--chrome-rule); color: var(--chrome-ink); opacity: 1; }
nav.pages a[aria-current="page"] { background: var(--chrome-ink); color: var(--chrome); opacity: 1; }
nav.pages a.me[aria-current="page"] { background: var(--navy); color: var(--chrome-ink); }
nav.pages a.out { color: var(--chrome-muted); }

@media (min-width: 1100px) {
  .sidenav { background: var(--chrome); border-right: 0; color: var(--chrome-ink); scrollbar-color: var(--chrome-rule) transparent; }
}
.sn-brand { color: var(--chrome-ink); border-bottom: 3px solid var(--navy); padding-bottom: var(--s3); border-radius: 0; }
.sn-brand .dot { background: var(--chrome-ink); }
.sn-brand .dot { border-radius: 1px; box-shadow: none; }
.sn-brand small { color: var(--chrome-muted); font-size: 10px; }
.sidenav .sn-grp > summary { color: var(--chrome-muted); font-size: 10.5px; }
.sidenav .sn-grp > summary:hover { color: var(--chrome-ink); }
.sidenav .sn-tree .sn-lab { color: var(--chrome-muted); }
.sidenav .sn-tree .sn-round ul, .sidenav .sn-sub ol { border-left-color: var(--chrome-rule); }
.sidenav .sn-link { color: var(--chrome-ink); opacity: .88; border-left: 3px solid transparent; border-radius: 0; }
.sidenav .sn-link:hover { background: var(--chrome-2); color: var(--chrome-ink); opacity: 1; }
.sidenav .sn-link .sn-m { background: var(--chrome-2); color: var(--chrome-muted); font-family: var(--f-mono); font-size: 11px; }
.sidenav .sn-link[aria-current="page"] { background: var(--navy); color: var(--chrome-ink); border-left-color: var(--chrome-ink); opacity: 1; }
.sidenav .sn-link[aria-current="page"] .sn-m { background: var(--chrome-ink); color: var(--navy); }
.sidenav .sn-link.me { color: var(--chrome-ink); font-weight: 800; }
.sidenav .sn-link.me[aria-current="page"] { background: var(--navy); color: var(--chrome-ink); border-left-color: var(--chrome-ink); }
.sidenav .sn-toc, .sidenav .sn-foot { border-top-color: var(--chrome-rule); }
.sidenav .sn-h { color: var(--chrome-muted); font-size: 10.5px; }
.sidenav .sn-toc li > a { color: var(--chrome-ink); opacity: .78; }
.sidenav .sn-toc li > a::before { background: var(--chrome-rule); border-radius: 0; }
.sidenav .sn-toc li > a:hover { background: var(--chrome-2); opacity: 1; }
.sidenav .sn-toc li.on > a { background: var(--chrome-2); color: var(--chrome-ink); opacity: 1; }
.sidenav .sn-toc li.on > a::before { background: var(--chrome-ink); }
.sidenav .sn-sub > summary { color: var(--chrome-muted); }
.sidenav .sn-sub li a { color: var(--chrome-ink); opacity: .82; }
.sidenav .sn-sub li a:hover { background: var(--chrome-2); }

urEdge": [{"k": "今大会で破った相手の強さ", "us": "平均1611", "them": "平均1432", "note": "武蔵丘は昭和第一(1374)と学習院(1848)、城東は府中(1433)と東村山(1430)"}, {"k": "今季の強さの点数の伸び（ブロック決勝の前まで）", "us": "+152", "them": "-26", "note": "武蔵丘 1603→1755、城東 1796→1770"}, {"k": "大勝を除いた1試合平均", "us": "1.52得点 1.72失点", "them": "1.35得点 2.08失点", "note": "4点差以上で勝った試合を除いて計算した、実力の近い相手との数字"}, {"k": "今季のリーグ", "us": "NSリーグ2部A 首位・無敗（4勝1分）", "them": "T5 Dブロック2位（得失点差 -2）", "note": "リーグの階層は城東のほうが上。順位をそのまま比べることはできない"}], "reviews": {"昭和第一": {"title": "昭和第一を5-2で下し、2回戦へ", "when": "2026/9/13 13:00・学習院高等科グラウンド", "body": "相手は今季の地区リーグ（DUOリーグ グループB）で首位に立っていたチーム。強さの点数は武蔵丘1668、昭和第一1374で、試合前の武蔵丘の勝つ見込みは84%。試合は序盤に昭和第一のGKが一発退場となり、武蔵丘はほとんどの時間を11人対10人で戦った。数的優位のなかで5-2と勝ち切り、2回戦へ進んだ。", "points": ["点数ほどの力の差は無かった。昭和第一の点数は大会の試合だけで決まり、首位に立った地区リーグ（DUOリーグ）の試合は入っていない", "DUOリーグの順位は2024年の6位、2025年の4位から、2026年は首位（6試合4勝2敗・13得点8失点）へ上がっていた。総体の支部予選で敗れた足立にも、リーグでは4-0で勝っている", "武蔵丘は10人の相手から2点を許している。退場が無ければ、点数が示す見込みどおりの試合にはならなかった可能性がある", "GKの退場は部員からの報告による（2026-10-14）。この試合の得点者・時間帯を報じた記事は無い"]}, "学習院": {"title": "点数で上回る学習院を、敵地で1-0で破る", "when": "2026/9/20 18:00・学習院高等科グラウンド（相手の本拠地）", "body": "この山で一番強かった相手を、相手のグラウンドで、完封で破った。強さの点数は学習院1848に対し武蔵丘1692で、試合前の武蔵丘の勝つ見込みは29%。東京の1次予選で90分決着した番狂わせ35件のうち17番目にあたる大きさで、数字の上でもはっきりした番狂わせだった。", "points": ["武蔵丘の強さの点数は1692からこの勝ちで上昇し、ブロック決勝には1755で臨んだ。学習院はいま1886", "学習院の点数は、昨年度末の1959から、この試合の時点で1848まで111点下がっていた", "選手権でブロック決勝に進んだのは2024年度以来。総体を含めれば3年続けてブロック決勝へ進んだ", "この試合の得点者・時間帯を報じた記事は無く、両校のSNSにも投稿は無い"]}, "城東": {"title": "ブロック決勝は城東に0-3。大会を終えた", "when": "2026/9/22 12:00・駒沢第二球技場（人工芝・気温29℃）", "body": "城東に0-3で敗れ、大会を終えた。試合前の見込みは武蔵丘48%。戦前の想定は「0-0の時間を長く持たせ、セットプレーで先に1点を取り、後半25分以降を守り切る」で、先制点は生まれなかった。\n\nブロック決勝は、武蔵丘にとってこの6年で7度目。勝ったのは2021年度の総体の1度で、点数で292点上の日本学園（現・明大世田谷）を0-0からのPK戦で破っている。城東との点数の差は15点で、7度のうち最も小さい。2022年度の日大二は193点上、2024年度の城北は324点上だった。勝つ見込みが最も高かったのは2025年度の総体の桜町戦（72%）で、城東戦（48%）はその次。0-3は、7度のなかで最も大きな点差の結果になった。\n\n城東は今季のT5リーグで7試合11得点、同格以上の相手からは1試合0.90点のチームだった。戦前は「格下相手の大量点で数字が膨らんでいる」とも読んでいたが、城東は同格の武蔵丘から3点を挙げ、その攻撃力が本物であることを示した。", "points": ["この代の「勝てば次の舞台」の試合は4試合。結果は0勝4敗で、3試合が無得点", "相手との点数の差15点は、5度のブロック決勝で最も小さい", "武蔵丘を破った城東の強さの点数は、この試合の1770からいま1963（+193）まで上がった。武蔵丘は1755から1681（-74）", "試合前の見込みは武蔵丘48%・城東52%。いまの両校の点数で計算し直すと16%で、モデルは城東を低く見積もっていた", "武蔵丘を破った城東は、選手権のブロック決勝に4回目の挑戦で初めて勝ち、2次予選に進んだ。過去3回はいずれも無得点だった。2次予選でも1回戦で文化学園杉並を2-1、2回戦で点数2189の国分寺を1-0で破った。3回戦は実践学園に1-2で敗れ、都大会を2勝で終えた", "この試合の得点者・時間帯を報じた記事は無い"]}}, "upsetsNote": "「勝つ見込み」は、試合の時点での両校の強さの点数から計算した値。これが低いほど番狂わせが大きい。PK戦の決着は90分が引き分けなので、印をつけて分けている。どちらかの学校の試合数が5試合に満たないものは、点数のぶれが大きいため外した。", "postmortem": {"title": "描いた勝ち筋と、起きたこと", "lead": "試合前に7つの勝ち筋と5つの警戒を挙げていた。城東サッカー部の公式サイトに前後半の内訳が載っており、前半2-0・後半1-0だったことが分かった。これを手がかりに、試合前の読みと結果を照らし合わせる。", "verdictLine": "勝ち筋はいずれも結果につながらず、警戒は武蔵丘の側の2点が当たった。", "keys": [{"n": "1", "t": "先制点を取る", "v": "×", "r": "取れなかった。前半だけで2失点している。城東は「リードしたら自陣でボールを回して時間を使う」チームで、前半のうちにその展開になった"}, {"n": "2", "t": "CKのセカンドボールを狙う", "v": "—", "r": "無得点のため、成否は判定できない。城東の守備がこの日も崩れなかったのか、その形を作れなかったのかは、記録が無く分からない"}, {"n": "3", "t": "無理に前に出ない。カウンターが城東の本体", "v": "×", "r": "3失点。追いかける展開では前に出ることになった。城東の速いカウンターという読み自体は合っていたが、そこを抑える試合運びにはならなかった"}, {"n": "4", "t": "後半25分以降に集中を上げる", "v": "×", "r": "外れた。城東が今季のリーグで1-0勝ちした2試合の得点時間は後半34分と後半25分で、「前半に点が入らないチーム」と読んでいた。この試合は前半2-0で、リーグ戦の時間帯の傾向とは違う展開になった"}, {"n": "5", "t": "打ち合いに乗らない", "v": "△", "r": "打ち合いにはならなかった。ただし前半で2点を追う展開になった時点で、望んでいた「0-0か1-0の静かな試合」の形ではなくなった"}, {"n": "6", "t": "学習院戦の1-0をもう一度やる", "v": "×", "r": "再現とはならなかった。城東は前半のうちに2点を挙げ、試合の形を先に決めた"}, {"n": "7", "t": "PK戦になっても分は悪くない", "v": "—", "r": "PK戦に到達しなかった"}], "missed": [{"claim": "城東は同格以上の相手から1試合0.90点しか取れない", "fact": "同格の武蔵丘から3点を取った"}, {"claim": "城東はヤマ場17試合で4勝13敗", "fact": "5勝目を、この試合で挙げた"}, {"claim": "城東は選手権のブロック決勝に3回出て3回とも無得点", "fact": "4回目で3得点。初めてこの舞台を突破した"}, {"claim": "城東の得点の75%は格下からの大勝で、実力の近い相手からは取れない", "fact": "今季のT5で7試合11得点だったチームが、同格から1試合3点を取った"}, {"claim": "城東の時計は後半25分以降。前半に点は入らない", "fact": "前半だけで2点。今季のリーグ戦7試合から読んだ時間帯の傾向は、この試合には当てはまらなかった"}], "hit": {"claim": "武蔵丘自身も、ヤマ場で点が取れていない／暑さと中1日は武蔵丘に不利", "fact": "警戒に挙げた2つが当たった。この代の「勝てば次の舞台」の試合は4試合0勝4敗、うち3試合が無得点。また、後から分かったこととして、城東は部 1点の幅で動いてきた", "90分で点数の上の相手を破ったのは6年で3回。2024年度の野津田（54点上）、同じ年度の中大杉並（71点上）、今年の学習院（156点上）", "選手権は通算13試合8勝5敗、34得点18失点。3つの大会のなかで最も勝率が高く、失点も少ない。秋に強い数字が出ている", "今季のNSリーグ2部Aは6勝1分0敗の無敗首位。21得点4失点で、リーグ戦の数字は安定している"]}}, "thisYear": {"title": "今季を数字で振り返る", "rows": [{"k": "戦績", "v": "3試合 2勝1敗", "n": "得点6・失点5"}, {"k": "破った相手の強さ", "v": "平均1611", "n": "昭和第一1374・学習院1848。同じ山の城東は平均1432の相手を破って上がってきた"}, {"k": "点数の動き", "v": "1603 → 1755 → 1681", "n": "シーズン開始 → 学習院戦の直後（この代の最高値）→ ブロック決勝のあと"}, {"k": "順位", "v": "293校中98位", "n": "東京の学校を同じ物差しの点数で並べた順位"}, {"k": "完封", "v": "2試合", "n": "総体の富士戦と、選手権2回戦の学習院戦"}, {"k": "番狂わせ", "v": "1件", "n": "学習院戦。東京の1次予選で90分決着した番狂わせ35件のうち17番目"}]}, "upsetsHighlight": "2回戦で起きた番狂わせに限れば、武蔵丘の学習院戦が1位。90分決着の35件は回戦が上がるほど少なくなる。その2回戦で、見込みの最も低い側が勝ったのがこの試合だった。", "outside": {"title": "世の中に残った武蔵丘の記録", "lead": "武蔵丘の試合について書かれたものが世の中にどれだけあるか、記事・掲示板・SNS・各校の公式サイトを当たった。戦い方や試合内容を記した文章は1件も見つからなかった。残っているのは数字の記録。", "items": [{"k": "城東サッカー部 公式サイト", "date": "2026/9/23", "v": "ブロック決勝の前後半の内訳。前半2-0・後半1-0で城東の3-0。得点者3名の記載あり。試合展開やコメントは無く、スコア表の1行のみ。写真は掲載されている", "src": "https://johtoh-fc-2021.jimdofree.com/"}, {"k": "学習院高等科サッカー部 公式サイト", "date": "2026/9/20", "v": "「本日の試合は都立武蔵丘高校と対戦しましたが、0ー1で敗戦しました。」— これが全文。相手の評価も得点経緯も書かれていない", "src": "https://ghsc1957.com/news/"}, {"k": "東京サッカーBBS 第5地区板", "date": "2026/9/15〜9/23", "v": "3試合すべての結果が書き込まれている。投稿はスコアと会場・キックオフ時刻で、論評や観戦記は載っていない", "src": "https://www.kawakitanet.com/soccerbbs/j/select.php?t_id=1783"}, {"k": "高校サッカードットコム", "date": "2026/9/20・9/22", "v": "その日の総括ニュース記事に武蔵丘の名前は無い。学習院を倒した試合も、番狂わせとして取り上げられてはいない。応援メッセージ欄の2026年度分は9/8の1件だけ", "src": "https://koko-soccer.com/team/1824/score"}, {"k": "学校公式サイト", "date": "常時", "v": "部の方針は「自由度が高く、伸び伸びとサッカーができる」「部員と教員で協力して、自分たちの考えを形にする」「とにかく勉強をちゃんとして、自分の未来につなげる」。活動は週5回。戦術的な掲示は無い", "src": "https://www.metro.ed.jp/musashigaoka-h/school_life/activities.html"}, {"k": "部の規模", "date": "2026/9 時点", "v": "選手28名・マネージャー4名（公式Instagramのプロフィール）。ブロック決勝で当たった城東は部員65名", "src": "https://www.instagram.com/musashigaoka_soccerclub/"}, {"k": "学校公式の大会 /* ---------- 共通: 強さの点数の推移（折れ線） ---------- */
function eloChart(series) {
  // series: [{name, hist, color, dash}]  2本まで。線の端に名前を直接書き、色だけに頼らない
  const W = 620, H = 260, L = 44, R = 110, TOP = 18, BOT = 34;
  const years = ["2021", "2022", "2023", "2024", "2025", "2026"];
  const vals = series.flatMap((sr) => years.map((y) => sr.hist[y]).filter((v) => v != null));
  const lo = Math.floor((Math.min(...vals, 1500) - 30) / 50) * 50, hi = Math.ceil((Math.max(...vals, 1500) + 30) / 50) * 50;
  const x = (i) => L + (i * (W - L - R)) / (years.length - 1), y = (v) => TOP + ((hi - v) * (H - TOP - BOT)) / (hi - lo);
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "強さの点数の年度ごとの推移" });
  const g = s("g", { class: "grid" });

  svg.append(g);

  svg.append(s("text", { x: L + 4, y: y(1500) - 5 }, "全体の平均 1500"));
  years.forEach((yr, i) => svg.append(s("text", { x: x(i), y: H - 10, "text-anchor": "middle" }, `${yr}年度`)));
  const ends = [];
  for (const sr of series) {
    const pts = years.map((yr, i) => [x(i), sr.hist[yr]]).filter((p) => p[1] != null).map(([px, v]) => [px, y(v), v]);
    svg.append(s("polyline", { points: pts.map((p) => p[0] + "," + p[1]).join(" "), fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-dasharray": sr.dash ? "6 4" : null }));
    pts.forEach((p, i) => svg.append(s("circle", { cx: p[0], cy: p[1], r: i === pts.length - 1 ? 5 : 4, fill: sr.color, stroke: "var(--surface)", "stroke-width": 2 })));
    const last = pts[pts.length - 1];
    ends.push({ y: last[1], v: last[2], name: sr.name });
  }
  ends.sort((a, b) => a.y - b.y);
  if (ends.length === 2 && ends[1].y - ends[0].y < 34) { const m = (ends[0].y + ends[1].y) / 2; ends[0].y = m - 17; ends[1].y = m + 17; }
  for (const e of ends) { svg.append(s("text", { x: W - R + 12, y: e.y - 2, class: "lab-ja" }, e.name)); svg.append(s("text", { x: W - R + 12, y: e.y + 14, class: "val" }, e.v)); }
  const cross = s("line", { y1: TOP, y2: H - BOT, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden" });
  svg.append(cross);
  const hit = s("rect", { x: L, y: TOP, width: W - L - R, height: H - TOP - BOT, fill: "transparent" });
  hit.addEventListener("mousemove", (ev) => {
    const r = svg.getBoundingClientRect(), px = ((ev.clientX - r.left) * W) / r.width;
    const i = Math.max(0, Math.min(years.length - 1, Math.round((px - L) / ((W - L - R) / (years.length - 1)))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    showTip(ev, `${years[i]}年度の終わり<br>` + series.map((sr) => `${sr.name} <b>${sr.hist[years[i]] ?? "―"}</b>`).join("<br>"));
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
  svg.append(hit);
  return svg;
}

function curveFigure() {
  // 点数の差（武蔵丘 − 相手）と、武蔵丘が勝つ見込みの関係。この山の相手の位置を点で示す
  const W = 620, H = 250, L = 44, R = 20, TOP = 16, BOT = 40, X0 = -250, X1 = 250;

function goalsChartSection(t) {
  const years = Object.keys(t.byYear).sort();
  const W = 620, H = 250, L = 40, R = 16, TOP = 16, BOT = 34;
  const vmax = Math.ceil(Math.max(...years.flatMap((y) => [t.byYear[y].gfPer, t.byYear[y].gaPer])) + 0.5);
  const band = (W - L - R) / years.length, bw = Math.min(28, band * 0.28);
  const y = (v) => TOP + ((vmax - v) * (H - TOP - BOT)) / vmax;
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "年度ごとの1試合平均の得点と失点" });
  for (let v = 0; v <= vmax; v += 1) { svg.append(s("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: v === 0 ? "var(--rule-strong)" : "var(--rule)" })); svg.append(s("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end" }, v)); }
  years.forEach((yr, i) => {

    const bar = (x0, v, col) => (v < 0.15 ? s("g") : s("path", { d: `M${x0},${y(0)} V${y(v) + 4} a4,4 0 0 1 4,-4 h${bw - 8} a4,4 0 0 1 4,4 V${y(0)} z`, fill: col }));
    const xa = cx - bw - 1, xb = cx + 1;

    svg.append(s("text", { x: xa + bw / 2, y: y(d.gfPer) - 6, "text-anchor": "middle", class: "val" }, d.gfPer.toFixed(1)));
    svg.append(s("text", { x: xb + bw / 2, y: y(d.gaPer) - 6, "text-anchor": "middle" }, d.gaPer.toFixed(1)));
    svg.append(s("text", { x: cx, y: H - 12, "text-anchor": "middle" }, `${yr}年度`));
    const hit = s("rect", { x: cx - band / 2, y: TOP, width: band, height: H - TOP - BOT, fill: "transparent" });
    hit.addEventListener("mousemove", (ev) => showTip(ev, `${yr}年度（${d.n}試合）<br>得点 <b>${d.gfPer}</b>／試合<br>失点 <b>${d.gaPer}</b>／試合<br>${d.w}勝 ${d.pkw}PK勝 ${d.pkl}PK負 ${d.l}敗`));

  for (const p of S.firstRound) (byBlock[p.block] = byBlock[p.block] || []).push(p);
  main.append(h("section", { class: "sec", id: "draw" },
    h("div", { class: "sec-head" }, h("h2", {}, "1回戦の組み合わせと結果"), h("p", {}, "数字は左の校が勝つ見込み（試合前の点数で計算）")),
    S.nDecided ? h("p", { class: "prose" }, `決着した${S.nDecided}試合のうち、試合前の見込みが高かった側が勝ったのは${S.hits}試合（${pct(S.hits / S.nDecided)}）。`
      + "×印は見込みの低かった側が勝った試合（番狂わせ）。見込みは試合の時点の点数で出していて、結果を知ったあとの点数は使っていない。") : null,
    h("div", { class: "blocks" }, Object.keys(byBlock).map((b) => h("div", { class: "blk" },
      h("h3", {}, byBlock[b][0].blockName || `第${b}ブロック`),
      h("ul", { class: "draw" }, byBlock[b].map((p) => {
        const r = p.result;
        if (!p.b) return h("li", {}, h("span", { class: "t win" }, nm(p.a)), h("b", { class: "num" }, "―"), h("span", { class: "small muted" }, "1回戦なし"));
        if (!r) return h("li", { class: p.a === "城東" || p.b === "城東" ? "mine" : null },
          h("span", { class: "t" + (p.p >= 0.5 ? " win" : "") }, nm(p.a)), h("b", { class: "num" }, pct(p.p)),
          h("span", { class: "t" + (p.p < 0.5 ? " win" : "") }, nm(p.b)));
        // 結果の向きは左右の並びに合わせる（記録の A・B が表の並びと逆のことがある）
        const sc = r.flip ? r.score.replace(/^(\d+)-(\d+)/, "$2-$1").replace(/PK (\d+)-(\d+)/, "PK $2-$1") : r.score;
        const fav = p.p >= 0.5 ? p.a : p.b, hit = r.winner === fav;
        return h("li", { class: (p.a === "城東" || p.b === "城東" ? "mine " : "") + "done" },
          h("span", { class: "t" + (r.winner === p.a ? " win" : " lost") }, nm(p.a)),
          h("b", { class: "num" }, pct(p.p)),
          h("span", { class: "t" + (r.winner === p.b ? " win" : " lost") }, nm(p.b)),
          h("span", { class: "res num" }, sc),
          h("span", { class: "mark " + (hit ? "hit" : "miss"), title: hit ? "見込みどおり" : "番狂わせ" }, hit ? "○" : "×"));
      })))))));

  const side = h("aside", { class: "stack side" });
  const blkTop = {};
  for (const t of S.teams) if (!blkTop[t.block] || t.blockWin > blkTop[t.block].blockWin) blkTop[t.block] = t;
  side.append(h("div", { class: "card" }, h("h2", {}, "山ごとの本命"),
    h("dl", { class: "kv" }, Object.keys(blkTop).flatMap((b) => [h("dt", {}, blkTop[b].blockName || `第${b}ブロック`), h("dd", {}, `${nm(blkTop[b].key)} ${pct(blkTop[b].blockWin, 1)}`)]))));
  side.append(h("div", { class: "card" }, h("h2", {}, "この数字の読み方"),
    h("ul", { class: "points" },
      h("li", {}, `強さの点数は、${D.firstYear}年度からの公式戦のうち結果の分かる ${D.ratedMatches.toLocaleString()} 試合とリーグ戦から計算したもの。2次予選に出る67校は、1次予選を戦った学校より試合数が多く、点数の精度も高い`),
      h("li", {}, "優勝確率を足すと100%になります。山の組み合わせを1試合ずつ掛け合わせているためです"),
      h("li", {}, "会場・日程・けが人・当日のメンバーは入っていません。あくまで過去の結果からの目安です"),
      h("li", {}, h("b", {}, "狛江はなぜ1次予選にいないのか"), "。1次予選を免除された33校の1つです。ただし免除の条件として割り出せた2つ"
        + "（その年の総体二次トーナメントに出た／TリーグのT1・T2に所属）のどちらにも当てはまりません。狛江は今季T3で、総体は一次トーナメントのブロック決勝で創価に0-1。"
        + "毎年1〜7校いる「条件では説明のつかない免除校」の1つで、高体連は免除の決まりを公開していません。"
        + (() => { const k = (D.second.teams || []).find((t) => t.key === "狛江");  // 点数は手で書かない（データを直すたびに古くなる）
          return k ? `強さの点数は${k.elo}で、2次予選に出る${D.second.nTeams}校のなかで${k.rank}位。実力で選ばれた可能性はあります` : ""; })()))));
  root.append(h("div", { class: "split" }, main, side));
}

/* ---------- 3年間の全試合（この代が戦った8大会） ---------- */
function squadSection() {
  const S = D.squad;
  if (!S) return null;
  const nm = (k) => k.replace("都・", "");
  const RES = { "勝": "○", "PK勝": "○", "PK負": "×", "負": "×", "分": "△" };
  const won = (r) => r === "勝" || r === "PK勝";

  const game = (g) => {
    const shift = g.thenOpp != null && g.nowOpp != null ? g.nowOpp - g.thenOpp : null;
    const grew = shift != null && shift >= 50 && !won(g.res);
    return h("li", { class: (won(g.res) ? "w" : "l") + (grew ? " grew" : "") },
      h("div", { class: "gl" },
        h("b", { class: "mark" }, RES[g.res] || "−"),
        h("span", { class: "rnd" }, g.round),
        h("span", { class: "sc num" }, `${g.gf}-${g.ga}`, g.pk ? h("small", {}, `PK ${g.pk}`) : null),
        h("span", { class: "opp" }, nm(g.opp)),
        h("span", { class: "dt num small muted" }, g.date || "")),
      h("div", { class: "gr small" },
        g.thenMe != null
          ? h("span", {}, "当時 ", h("b", { class: "num" }, g.thenMe), " − ", h("b", { class: "num" }, g.thenOpp),
              g.thenProb != null ? h("span", { class: "muted" }, `（勝つ見込み ${pct(g.thenProb)}）`) : null)
          : null,
        h("span", { class: "now" }, "現在 ", h("b", { class: "num" }, g.nowMe), " − ", h("b", { class: "num" }, g.nowOpp),
          shift != null && Math.abs(shift) >= 50
            ? h("span", { class: "shift " + (shift > 0 ? "up" : "down") }, `相手 ${shift > 0 ? "+" : ""}${shift}`)
            : null),
        grew
          ? h("span", { class: "grew-note" }, `${nm(g.opp)}はこの試合のあと${shift}点上げ、いまは武蔵丘より`
              + (g.nowOpp > g.nowMe ? `${g.nowOpp - g.nowMe}点上にいる` : "下にいる"))
          : null,
        g.oppLeagueGames <= 2
          ? h("span", { class: "thin-note" },
              `※${nm(g.opp)}のリーグ戦は${g.oppLeagueGames}試合しか記録が無く、点数が動きにくい`,
              (D.squad.coverageByDistrict || {})[g.oppDistrict]
                ? `（第${g.oppDistrict}地区は${D.squad.coverageByDistrict[g.oppDistrict]}）` : "")
          : null));
  };

  const tour = (t) => {
    const r = t.record, w = r["勝"] + r["PK勝"], l = r["負"] + r["PK負"];
    return h("section", { class: "tour" },
      h("div", { class: "th" },
        h("b", { class: "num yr" }, t.year),
        h("span", { class: "sr" }, t.series),
        h("span", { class: "small muted" }, t.stage),
        h("span", { class: "rec num" }, `${w}勝${l}敗`),
        h("span", { class: "reach" }, t.reach)),
      (D.final && D.final.tournamentReviews || {})[`${t.year}-${t.series}`]
        ? h("p", { class: "tour-note prose" }, D.final.tournamentReviews[`${t.year}-${t.series}`])
        : null,
      h("ul", { class: "glist" }, t.games.map(game)));
  };

  return h("section", { class: "sec", id: "squad" },
    h("div", { class: "sec-head" }, h("h2", {}, "3年間の全19試合"),
      h("p", {}, `${S.years[0]}〜${S.years[S.years.length - 1]}年度 ${S.tournaments.length}大会`)),
    h("p", { class: "prose" }, "点数は2つ並べています。左が試合の時点、右がいまの値です。"
      + "試合のときは下だった相手が、その後に上へ行くことがあります。片方だけでは相手の力を読み違えます。"),
    h("p", { class: "prose small muted" }, "点数は大会の結果にリーグ戦を足して計算しています。"
      + "ただしリーグ戦の記録がどれだけ残っているかは地区によって差があり、"
      + (() => {
        const c = Object.entries(S.coveragePerSchool || {}).sort((a, b) => a[1] - b[1]);
        return c.length ? `1校あたり${Math.round(c[0][1])}試合（第${c[0][0]}地区）から${Math.round(c[c.length - 1][1])}試合（第${c[c.length - 1][0]}地区）まで開きがあります。` : "";
      })()
      + "記録の少ない学校は点数が動きにくく、実力より低く出ることがあります。該当する相手には試合ごとに断りを入れました。"),
    h("div", { class: "tours" }, S.tournaments.map(tour)));
}

/* ---------- 都内全校データベース ---------- */
function renderIndexBook() {
  const X = D.book, root = $("#app"), me = D.me;
  const nm = (k) => k.replace("都・", "");
  const RES = { "○": "w", "●": "l", "△": "d" };
  const byD = {};
  for (const s of X.schools) (byD[s.district ?? "?"] = byD[s.district ?? "?"] || []).push(s);
  for (const k of Object.keys(byD)) byD[k].sort((a, b) => b.elo - a.elo);

  root.append(h("div", { class: "masthead" },
    h("div", { class: "eyebrow" }, "TOKYO DATABASE"),
    h("h1", {}, "都内全校データベース — 来季の相手を探す"),
    h("p", { class: "lead" }, `東京都の${X.nSchools}校を、大会とリーグ戦の記録から同じ物差しで並べました。`

    h("p", { class: "lead small muted" }, "来季の相手を調べるための一覧です。地区のツリーか、五十音の並びから開いてください。")));

  /* 武蔵丘から見た数字（学校を開いたとき、いちばん上に出す） */
  function vsMeBlock(s) {
    const hh = s.h2h || { n: 0, games: [], summary: {} }, sm = hh.summary || {};

    const sign = diff == null ? "―" : diff > 0 ? `+${diff}` : diff < 0 ? `−${Math.abs(diff)}` : "±0";
    const MARK = { "勝": "○", "PK勝": "○", "PK負": "×", "負": "×", "分": "△" };
    const cls = { "勝": "w", "PK勝": "w", "PK負": "l", "負": "l", "分": "d" };
    return h("div", { class: "sch-blk vs-me" },
      h("h4", {}, "武蔵丘から見ると"),
      s.winProbVsMe != null
        ? h("div", { class: "vs-grid" },
            h("div", { class: "vs-cell" }, h("span", { class: "small muted" }, "武蔵丘が勝つ見込み（いまの点数どうし）"),
              h("b", { class: "num vs-big" }, pct(s.winProbVsMe, s.winProbVsMe < 0.01 || s.winProbVsMe > 0.99 ? 1 : 0))),
            h("div", { class: "vs-cell" }, h("span", { class: "small muted" }, "強さの点数"),
              h("span", { class: "num" }, "武蔵丘 ", h("b", {}, X.meElo), " ／ ", nm(s.display), " ", h("b", {}, s.elo))),
            h("div", { class: "vs-cell" }, h("span", { class: "small muted" }, "差（相手 − 武蔵丘）"),
              h("b", { class: "num vs-big" }, sign)))
        : null,
      s.winProbVsMe != null
        ? h("p", { class: "small muted" }, "この見込みは、いまの点数どうしを比べた目安です。過去の試合の、試合前の見込みではありません。")
        : null,
      h("div", { class: "vs-h2h" },
        h("b", {}, `直接対戦（${hh.since || 2021}年度以降）`),
        hh.n
          ? h("span", { class: "num" }, ` ${hh.n}試合　${sm.w}勝` + (sm.pkw ? `${sm.pkw}PK勝` : "") + (sm.pkl ? `${sm.pkl}PK負` : "") + (sm.d ? `${sm.d}分` : "") + `${sm.l}敗　得点${sm.gf}・失点${sm.ga}`)
          : null),
      hh.n
        ? h("ul", { class: "mini vs-games" }, hh.games.map((g) =>
            h("li", { class: cls[g.res] || "" }, h("b", { class: "r" }, MARK[g.res] || "−"),
              h("span", { class: "sc num" }, `${g.gf}-${g.ga}${g.pk ? `（PK ${g.pk}）` : ""}`),
              h("span", { class: "res-t" }, g.res),
              h("span", { class: "small muted" }, `${g.year}年度 ${g.series} ${g.round}`.trim()))))
        : h("p", { class: "small" }, `${hh.since || 2021}年度以降、武蔵丘との公式戦は無い`));
  }

  /* 1校ぶんの詳細 */
  function card(s) {
    const thin = s.leagueGames <= 2;
    const ry = (s.recentYears || []).map((y) =>
      h("span", { class: "yr-chip" }, h("b", { class: "num" }, y.year), ` ${y.w}勝${y.d ? y.d + "分" : ""}${y.l}敗`,
        h("small", { class: "muted" }, ` ${y.best || ""}`)));
    const ts = (s.thisSeason || []).map((g) =>
      h("li", { class: RES[g.res] || "" }, h("b", { class: "r" }, g.res),
        h("span", { class: "sc num" }, `${g.gf}-${g.ga}`), h("span", { class: "op" }, nm(g.opp)),
        h("span", { class: "small muted" }, `${g.series}${g.round ? " " + g.round : ""}${g.date ? " " + g.date : ""}`)));
    const co = (s.commonOpponents || []).map((c) =>
      h("li", {}, h("span", { class: "op" }, nm(c.opp)),
        h("span", { class: "small" }, `武蔵丘 ${c.me.res} ${c.me.gf}-${c.me.ga}（${c.me.year}）`),
        h("span", { class: "small" }, `${nm(s.display)} ${c.them.res} ${c.them.gf}-${c.them.ga}（${c.them.year}）`)));
    return h("li", { class: "card-row" + (s.key === me ? " me" : "") },
      // 詳しい表示は、押した行の下に全幅で開く（details の中身。行のグリッドには入れない）
      h("details", { class: "sch" },
        h("summary", {},
          h("b", { class: "nm" }, nm(s.display), s.key === me ? h("span", { class: "tag first me" }, "自校") : null),
          h("b", { class: "el num" }, s.elo),
          h("span", { class: "small muted" }, s.district ? `第${s.district}地区・${s.city || ""}` : "地区不明"),

            h("span", {}, "記録 ", h("b", {}, `大会${s.tournamentGames}・リーグ${s.leagueGames}`), thin ? h("span", { class: "thin-mark" }, " ▲") : null),

            s.best ? h("span", {}, "最高 ", h("b", {}, `${s.best.text}`), h("small", { class: "muted" }, ` ${s.best.year}`)) : null),

          ts.length ? h("div", { class: "sch-blk" }, h("h4", {}, "今季の試合"),
            h("ul", { class: "mini" }, ts),
            h("p", { class: "small muted" }, "今季の選手権は多くの試合に日付の記録がありません。大会と回戦の順で並べており、厳密な時系列ではありません。")) : null,
          co.length ? h("div", { class: "sch-blk" }, h("h4", {}, "共通の対戦相手"),
            h("ul", { class: "mini co" }, co),
            h("p", { class: "small muted" }, "直接の対戦が無くても、同じ相手との結果から力関係の見当がつきます。ただし年度が違えばメンバーも違うので、弱い手がかりです。")) : null)));
  }

  const main = h("div", { class: "stack lg" });
  const mine = byD[X.myDistrict] || [];
  main.append(h("section", { class: "sec" },
    h("div", { class: "sec-head" }, h("h2", {}, `第${X.myDistrict}地区`), h("p", {}, `武蔵丘が属する地区・${mine.length}校・点数の高い順`)),
    h("ul", { class: "book" }, mine.map(card))));

  // 押されるまで中身を作らない（全校ぶんのカードを2通りの並びで作ると重い）
  const lazyDetails = (cls, label, count, makeList) => {
    const body = h("div", { class: "body" });
    const d = h("details", { class: cls }, h("summary", {}, label, h("small", { class: "muted" }, ` ${count}校`)), body);

  /* 地区から探す（第5地区は上に別立てで出している） */

      () => h("ul", { class: "book" }, byD[k].map(card))))));

  /* 五十音から探す（行ごとに、読みの順） */
  const ROWS = [["あ", "あいうえおぁぃぅぇぉゔ"], ["か", "かきくけこ"], ["さ", "さしすせそ"], ["た", "たちつてとっ"],
    ["な", "なにぬねの"], ["は", "はひふへほ"], ["ま", "まみむめも"], ["や", "やゆよゃゅょ"], ["ら", "らりるれろ"], ["わ", "わゐゑをんゎ"]];
  const rowOf = (kana) => {
    const c = (kana || "").normalize("NFD")[0];   // 濁点・半濁点を外した字で行を引く
    const r = ROWS.find(([, cs]) => cs.includes(c));
    return r ? r[0] : null;
  };
  const byRow = {};
  for (const s of X.schools) (byRow[rowOf(s.kana) || "他"] = byRow[rowOf(s.kana) || "他"] || []).push(s);

    h("div", { class: "sec-head" }, h("h2", {}, "点数の高い順"), h("p", {}, `全${X.nSchools}校・詳細は地区か五十音から`)),

        h("li", {}, "来季の相手が決まったら、", h("b", {}, "地区"), "か", h("b", {}, "五十音"), "から探す。学校名を押すと、武蔵丘が勝つ見込みと過去の対戦、直近3年の成績・今季の試合・共通の対戦相手が開きます"),

/* ======================================================================
   年代記のページ（年度・その前の5年間・前史・3年間の通算・全年度の通算）
   データは build_years.py（out/scout/years.json）と build_history.py の payload_for。
   本文の数字は prose_tokens.py が書き出しのときに埋めてある
   ====================================================================== */
const cleanName = (n) => String(n || "").replace(/^(都・|国・|私・)/, "");
const RESMARK = { "勝": "○", "PK勝": "○", "不戦勝": "○", "PK負": "×", "負": "×", "不戦敗": "×" };
const isWin = (r) => r === "勝" || r === "PK勝" || r === "不戦勝";
function recText(s) {
  return `${s.w}勝` + (s.pkw ? `${s.pkw}PK勝` : "") + (s.pkl ? `${s.pkl}PK負` : "") + `${s.l}敗`;
}
function signedInt(n) { return n == null ? "―" : (n > 0 ? "+" : "") + n; }

/* トーナメント表（部分木）。左に学校、右へ勝ち上がる。赤は勝ち上がり、太い線は武蔵丘の道 */
function treeSVG(tree) {
  const leaves = [];
  const depthOf = (n) => ("t" in n ? 0 : 1 + Math.max(...n.c.map(depthOf)));
  const D0 = depthOf(tree);
  const ROW = 30, LABEL = 132, COL = 58, TOP = 18;
  const STUB = 84, W = LABEL + D0 * COL + STUB + 100, x = (d) => LABEL + (D0 - d) * COL;  // d は根からの深さ
  const svg = s("svg", { class: "bracket tree", role: "img" });
  const lines = [], texts = [];
  const winnerOf = (n) => ("t" in n ? n.k : n.m.w);
  const place = (n, d) => {
    if ("t" in n) {
      const y = TOP + leaves.length * ROW;
      leaves.push(n);
      texts.push(s("text", { class: "nm" + (n.k === D.me ? " me-t" : ""), x: LABEL - 8, y: y + 4.5, "text-anchor": "end" }, cleanName(n.t)));
      return { y, x: LABEL - 4 };
    }
    const kids = n.c.map((c) => place(c, d + 1));
    const xm = x(d), ym = (kids[0].y + kids[1].y) / 2;
    n.c.forEach((c, i) => {
      const won = n.m.w && winnerOf(c) === n.m.w;
      const mine = winnerOf(c) === D.me;
      lines.push(s("path", { class: "ln" + (won ? " win" : "") + (mine ? " mine" : ""), d: `M${kids[i].x},${kids[i].y} H${xm} V${ym}` }));
    });
    const m = n.m, pk = m.pa !== "" && m.pa != null ? `(${m.pa}-${m.pb})` : "";
    if (m.sa !== "" && m.sa != null) texts.push(s("text", { class: "score", x: xm + 5, y: ym - 5 }, `${m.sa}-${m.sb}${pk}`));
    texts.push(s("text", { class: "mlab", x: xm + 5, y: ym + 13 }, m.round));
    return { y: ym, x: xm };
  };
  const root = place(tree, 0);
  const champ = tree.m && tree.m.w;
  lines.push(s("path", { class: "ln win" + (champ === D.me ? " mine" : ""), d: `M${root.x},${root.y} H${root.x + STUB}` }));
  if (champ) texts.push(s("text", { class: "dest", x: root.x + STUB + 6, y: root.y + 4.5 }, cleanName(champ)));
  svg.setAttribute("viewBox", `0 0 ${W} ${TOP + leaves.length * ROW}`);
  svg.setAttribute("aria-label", `トーナメント表（${leaves.length}校）`);
  lines.forEach((l) => svg.append(l));
  texts.forEach((t) => svg.append(t));
  return svg;
}

/* 1試合の行。当時の点数・見込みと、相手のいまの点数を並べる */

/* ---------- 全年度の通算 ---------- */
function eloLineSVG(hist) {
  const ys = Object.keys(hist).map(Number).sort((a, b) => a - b);
  const vs = ys.map((y) => hist[y]);
  const W = 640, H = 220, L = 44, R = 16, T = 18, Bm = 28;
  const lo = Math.floor((Math.min(...vs) - 40) / 100) * 100, hi = Math.ceil((Math.max(...vs) + 40) / 100) * 100;
  const X = (y) => L + (y - ys[0]) / (ys[ys.length - 1] - ys[0]) * (W - L - R);
  const Y = (v) => T + (hi - v) / (hi - lo) * (H - T - Bm);
  const svg = s("svg", { class: "chart eloline", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "年度末の強さの点数の推移" });
  for (let v = lo; v <= hi; v += 100) {
    svg.append(s("line", { class: v === 1500 ? "base" : "grid", x1: L, x2: W - R, y1: Y(v), y2: Y(v) }));
    svg.append(s("text", { class: "ax", x: L - 6, y: Y(v) + 4, "text-anchor": "end" }, v));
  }
  svg.append(s("path", { class: "line", d: ys.map((y, i) => `${i ? "L" : "M"}${X(y)},${Y(hist[y])}`).join(" ") }));
  const peak = ys[vs.indexOf(Math.max(...vs))], low = ys[vs.indexOf(Math.min(...vs))], last = ys[ys.length - 1];
  ys.forEach((y) => {
    const c = s("circle", { class: "dot" + (y === last ? " last" : ""), cx: X(y), cy: Y(hist[y]), r: y === last ? 5 : 3.5 });
    c.append(s("title", {}, `${y}年度末 ${hist[y]}`));
    svg.append(c);
    if (y % 2 === 0 || y === last) svg.append(s("text", { class: "ax", x: X(y), y: H - 8, "text-anchor": "middle" }, String(y)));
    if (y === peak || y === low || y === last) svg.append(s("text", { class: "lab", x: X(y), y: Y(hist[y]) - 9, "text-anchor": "middle" }, hist[y]));
  });
  return svg;
}

  root.append(h("section", { class: "sec" },
    h("div", { class: "sec-head" }, h("h2", {}, "数字で見る通算"), h("p", {}, `${ys[0]}〜${ys[ys.length - 1]}年度`)),
    h("div", { class: "tbl" }, h("table", {}, h("tbody", {}, [
      ["公式戦", `${A.n}試合`, `大会${A.cup}・リーグ戦${A.league}`],
      ["勝敗", `${A.win}勝${A.draw}分${A.lose}敗`, `勝率${Math.round(A.win / played * 100)}%` + (A.unknown ? `・結果の分からない試合が${A.unknown}` : "")],
      ["得失点", `${A.gf} - ${A.ga}`, `差 ${signedInt(A.gf - A.ga)}`],

    ].map((r) => h("tr", {}, h("td", {}, h("b", {}, r[0])), h("td", { class: "n big2" }, r[1]), h("td", { class: "small muted" }, r[2]))))))));
  root.append(h("section", { class: "sec" },
    h("div", { class: "sec-head" }, h("h2", {}, "通算の要点"), h("p", {}, "表と図から言えること")),
    h("ul", { class: "points" }, A.points.map(([t, b]) => h("li", {}, h("b", {}, t), "　", b)))));
  root.append(h("section", { class: "sec" },
    h("div", { class: "sec-head" }, h("h2", {}, "強さの点数の歩み"), h("p", {}, "年度末の値")),
    h("div", { class: "card" }, eloLineSVG(A.eloHistory),
      h("p", { class: "small muted" }, "1500が東京全体の平均。点数は大会とリーグ戦（重みは半分）から計算し、年度をまたいでも平均へ戻さずに持ち越しています。"))));
  const hs = historySection(); if (hs) root.append(hs);
  const order = (kv) => [kv[1].league ? 1 : 0, ["総体", "選手権", "新人戦", "関東"].indexOf(kv[0]), -kv[1].n];
  root.append(h("section", { class: "sec" },
    h("div", { class: "sec-head" }, h("h2", {}, "大会・リーグ別の成績"), h("p", {}, "通算")),
    h("div", { class: "tbl" }, h("table", {},
      h("thead", {}, h("tr", {}, ["大会", "試合", "勝", "分", "敗", "勝率"].map((c, i) => h("th", { class: i ? "n" : null }, c)))),
      h("tbody", {}, Object.entries(A.series).sort((a, b) => { const x = order(a), y = order(b); return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]; }).map(([k, v]) => h("tr", {},
        h("td", {}, k), h("td", { class: "n" }, v.n), h("td", { class: "n" }, v.win), h("td", { class: "n" }, v.draw), h("td", { class: "n" }, v.lose),
        h("td", { class: "n" }, v.win + v.draw + v.lose ? `${Math.round(v.win / (v.win + v.draw + v.lose) * 100)}%` : "―"))))))));
  root.append(h("section", { class: "sec" },
    h("div", { class: "sec-head" }, h("h2", {}, "よく当たる相手"), h("p", {}, `対戦の多い順に${A.opponents.length}校`)),
    h("div", { class: "tbl" }, h("table", {},
      h("thead", {}, h("tr", {}, ["相手", "試合", "勝", "分", "敗", "不明"].map((c, i) => h("th", { class: i ? "n" : null }, c)))),
      h("tbody", {}, A.opponents.map(([n, c]) => {
        const w = A.beat[n] || 0, d = A.drew[n] || 0, l = A.lost[n] || 0;
        return h("tr", {}, h("td", {}, n), ...[c, w, d, l, c - w - d - l || ""].map((v) => h("td", { class: "n" }, v)));
      }))))));
}
